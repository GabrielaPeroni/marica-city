name: Deploy check

# Smoke-tests the public site and runs Lighthouse against it every day, and on
# demand. (Deployment URLs sit behind Vercel's deployment protection, so it uses
# the public domain rather than reacting to each deployment.)
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Smoke-test production
    runs-on: ubuntu-latest
    env:
      SITE: https://marica-city.vercel.app
    steps:
      - uses: actions/checkout@v7

      - name: Pages respond
        run: |
          for path in /healthz/ / /explore/ /eventos/ /sobre/ /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors "$SITE$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.SITE }}/
            ${{ env.SITE }}/explore/
            ${{ env.SITE }}/eventos/
          configPath: .github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
