name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  linters:
    name: Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Check __init__.py files
        run: |
          uv run python scripts/check_init_files.py

      - name: Run Black
        run: |
          uv run black --check --diff .

      - name: Run isort
        run: |
          uv run isort --check-only --diff .

      - name: Run autoflake
        run: |
          uv run autoflake --check --remove-all-unused-imports --remove-unused-variables --remove-duplicate-keys --ignore-init-module-imports --recursive apps/ config/ manage.py scripts/check_init_files.py

      - name: Run flake8
        run: |
          uv run flake8 --select=TMS010,TMS011,TMS012,TMS013,TMS020,TMS021,TMS022 apps/ config/ manage.py scripts/check_init_files.py

      - name: Run pip-audit
        run: |
          uv run pip-audit

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check compiled CSS, fonts and icons are current
        run: |
          npm ci
          npm run build:css
          git diff --exit-code -- static/css/app.css static/fonts static/vendor apps/core/icons
          test -z "$(git status --porcelain -- static/fonts static/vendor apps/core/icons)" || (echo "::error::Run 'npm run build:css' and commit the output." && exit 1)

      - name: Install Prettier
        run: |
          npm install -g prettier@3.1.0

      - name: Run Prettier
        run: |
          prettier --config .github/.prettierrc --ignore-path .github/.prettierignore --check "**/*.{js,ts,jsx,tsx,json,yaml,yml,md,html,css}" || (echo "::error::Some files need formatting. Run 'prettier --write .' to fix." && exit 1)

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"
      SECRET_KEY: test-secret-key-for-ci
      GOOGLE_OAUTH_CLIENT_ID: test-client-id-for-ci-only
      RATELIMIT_ENABLE: "False"
      BASE_URL: http://localhost:8000
      CHECK_USER: browser-check
      CHECK_PASSWORD: browser-check-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the site with demo content
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py load_demo_data
          uv run python manage.py shell -c "from apps.accounts.models import User; User.objects.create_user('$CHECK_USER', password='$CHECK_PASSWORD', is_staff=True)"
          uv run python manage.py runserver 8000 --noreload &
          curl -s --retry 20 --retry-connrefused --retry-delay 1 -o /dev/null "$BASE_URL/healthz/"

      - name: Check calls, failures and idle work on every page
        run: |
          npm run check:browser

  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DEBUG: "True"
      SECRET_KEY: test-secret-key-for-ci
      GOOGLE_OAUTH_CLIENT_ID: test-client-id-for-ci-only
      RATELIMIT_ENABLE: "False"
      # Same database engine as production
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Check Django system
        run: |
          uv run python manage.py check

      - name: Check for missing migrations
        run: |
          uv run python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage (floor 80%)
        run: |
          uv run coverage run manage.py test apps --verbosity=2
          uv run coverage report --fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
